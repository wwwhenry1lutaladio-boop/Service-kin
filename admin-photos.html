<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validation des photos - SERVICE KIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f2f4f7;margin:0;padding:20px}
main{max-width:750px;margin:auto}
h1{color:#123b65}
.card{background:white;padding:18px;margin:15px 0;border-radius:12px}
input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box}
button{background:#123b65;color:white;border:0;border-radius:7px;font-weight:bold}
.photo{width:100%;max-height:350px;object-fit:contain}
.approve{background:green}
.reject{background:#c47b00}
.delete{background:#b42318}
#app{display:none}
#message{color:#b42318}
</style>
</head>
<body>
<main>
<h1>SERVICE KIN</h1>
<h2>Administration des photos</h2>

<section id="login" class="card">
<h3>Connexion administrateur</h3>
<input id="email" type="email" placeholder="Adresse e-mail">
<input id="password" type="password" placeholder="Mot de passe">
<button id="loginBtn" onclick="connexion()">Se connecter</button>
<p id="message"></p>
</section>

<section id="app">
<button onclick="deconnexion()">Déconnexion</button>
<h3>Photos des professionnels</h3>
<div id="photos">Chargement...</div>
</section>
</main>

<script>
const URL = "https://ikhjunfdqjnhonxisjeh.supabase.co";
const KEY = "sb_publishable_afY2FCUMd8FevvoqJv9Jrg_AvGeY0hE";
const db = supabase.createClient(URL, KEY);

const loginBox = document.getElementById("login");
const app = document.getElementById("app");
const message = document.getElementById("message");

async function verifierAdmin(user) {
  const {data,error} = await db
    .from("admins")
    .select("id,role")
    .eq("id",user.id)
    .eq("role","owner")
    .maybeSingle();

  if(error) throw error;
  if(!data) throw new Error("Ce compte n'a pas les droits administrateur.");
}

async function connexion() {
  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.textContent = "Connexion...";
  message.textContent = "";

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if(!email || !password) {
      throw new Error("Entre ton adresse e-mail et ton mot de passe.");
    }

    const {data,error} = await db.auth.signInWithPassword({
      email,password
    });

    if(error) throw error;

    await verifierAdmin(data.user);

    loginBox.style.display = "none";
    app.style.display = "block";
    await chargerPhotos();

  } catch(error) {
    message.textContent = error.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Se connecter";
  }
}

async function chargerPhotos() {
  const zone = document.getElementById("photos");
  zone.textContent = "Chargement des photos...";

  const {data,error} = await db
    .from("realisations")
    .select("*")
    .order("created_at",{ascending:false});

  if(error) {
    zone.textContent = "Erreur : " + error.message;
    return;
  }

  zone.innerHTML = "";

  if(!data || data.length === 0) {
    zone.textContent = "Aucune photo envoyée pour le moment.";
    return;
  }

  for(const photo of data) {
    const {data:urlData,error:urlError} = await db.storage
      .from("realisations")
      .createSignedUrl(photo.photo_path,3600);

    const card = document.createElement("div");
    card.className = "card";

    const titre = document.createElement("h3");
    titre.textContent = "Professionnel n° " + photo.professionnel_id;
    card.appendChild(titre);

    if(!urlError && urlData) {
      const img = document.createElement("img");
      img.src = urlData.signedUrl;
      img.className = "photo";
      img.alt = "Photo envoyée";
      card.appendChild(img);
    } else {
      const erreur = document.createElement("p");
      erreur.textContent = "Photo inaccessible : " + (urlError?.message || "");
      card.appendChild(erreur);
    }

    const description = document.createElement("p");
    description.textContent = photo.description || "Sans description";
    card.appendChild(description);

    const statut = document.createElement("p");
    statut.textContent = "Statut : " + photo.statut;
    card.appendChild(statut);

    const approuver = document.createElement("button");
    approuver.className = "approve";
    approuver.textContent = "Approuver";
    approuver.onclick = () => modifier(photo.id,"approuvee");
    card.appendChild(approuver);

    const refuser = document.createElement("button");
    refuser.className = "reject";
    refuser.textContent = "Refuser";
    refuser.onclick = () => modifier(photo.id,"refusee");
    card.appendChild(refuser);

    const supprimer = document.createElement("button");
    supprimer.className = "delete";
    supprimer.textContent = "Supprimer";
    supprimer.onclick = () => supprimerPhoto(photo);
    card.appendChild(supprimer);

    zone.appendChild(card);
  }
}

async function modifier(id,statut) {
  const {error} = await db
    .from("realisations")
    .update({statut})
    .eq("id",id);

  if(error) {
    alert("Erreur : " + error.message);
    return;
  }

  alert("Statut mis à jour !");
  await chargerPhotos();
}

async function supprimerPhoto(photo) {
  if(!confirm("Veux-tu vraiment supprimer cette photo ?")) return;

  const {error:storageError} = await db.storage
    .from("realisations")
    .remove([photo.photo_path]);

  if(storageError) {
    alert("Erreur de suppression : " + storageError.message);
    return;
  }

  const {error} = await db
    .from("realisations")
    .delete()
    .eq("id",photo.id);

  if(error) {
    alert("Erreur : " + error.message);
    return;
  }

  await chargerPhotos();
}

async function deconnexion() {
  await db.auth.signOut();
  app.style.display = "none";
  loginBox.style.display = "block";
}

async function verifierSession() {
  const {data} = await db.auth.getSession();

  if(!data.session) return;

  try {
    await verifierAdmin(data.session.user);
    loginBox.style.display = "none";
    app.style.display = "block";
    await chargerPhotos();
  } catch(error) {
    message.textContent = error.message;
    await db.auth.signOut();
  }
}

verifierSession();
</script>
</body>
</html>
