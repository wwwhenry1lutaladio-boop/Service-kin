
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration des photos - SERVICE KIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f2f4f7;margin:0;padding:18px;color:#222}
main{max-width:850px;margin:auto}
.box,.photo{background:white;padding:16px;margin:12px 0;border-radius:10px}
input,button{padding:12px;margin:5px 0;width:100%;box-sizing:border-box}
button{background:#075e42;color:white;border:0;border-radius:6px;font-weight:bold}
button:disabled{opacity:.5}
button.refuse{background:#b45309}
button.delete{background:#b42318}
img{width:100%;max-height:300px;object-fit:contain}
#message{white-space:pre-wrap;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h2>Administration des photos SERVICE KIN</h2>

<section id="login" class="box">
<h3>Connexion administrateur</h3>
<input id="email" type="email" placeholder="Adresse e-mail">
<input id="password" type="password" placeholder="Mot de passe">
<button id="loginBtn" onclick="connexion()">Se connecter</button>
<p id="message">Initialisation...</p>
</section>

<section id="app" class="hidden">
<h3>Photos des professionnels</h3>
<button onclick="chargerPhotos()">Actualiser les photos</button>
<div id="photos"></div>
</section>
</main>

<script>
(function () {
  const URL = "https://ikhjunfdqjnhonxisjeh.supabase.co";
  const KEY = "sb_publishable_afY2FCUMd8FevvoqJv9Jrg_AvGeY0hE";

  function message(texte) {
    document.getElementById("message").textContent = texte;
  }

  if (!window.supabase || !window.supabase.createClient) {
    message("ERREUR : impossible de charger Supabase. Vérifie ta connexion Internet.");
    return;
  }

  window.serviceKinClient = window.supabase.createClient(URL, KEY);

  function delai(promise, ms, nom) {
    return Promise.race([
      promise,
      new Promise((_, reject) => {
        setTimeout(() => reject(new Error("Délai dépassé : " + nom)), ms);
      })
    ]);
  }

  async function verifierAdmin(user) {
    message("Étape 2 : vérification des droits administrateur...");

    const resultat = await delai(
      window.serviceKinClient
        .from("admins")
        .select("id, role")
        .eq("id", user.id)
        .maybeSingle(),
      15000,
      "vérification administrateur"
    );

    if (resultat.error) throw resultat.error;

    if (!resultat.data || resultat.data.role !== "owner") {
      throw new Error("Ce compte ne possède pas les droits administrateur owner.");
    }
  }

  window.connexion = async function () {
    const bouton = document.getElementById("loginBtn");
    bouton.disabled = true;

    try {
      message("Étape 1 : connexion à Supabase...");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        throw new Error("Entre ton adresse e-mail et ton mot de passe.");
      }

      const resultat = await delai(
        window.serviceKinClient.auth.signInWithPassword({
          email: email,
          password: password
        }),
        15000,
        "connexion Supabase"
      );

      if (resultat.error) throw resultat.error;

      await verifierAdmin(resultat.data.user);

      document.getElementById("login").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");

      await window.chargerPhotos();

    } catch (erreur) {
      message("ERREUR : " + (erreur.message || "Erreur inconnue"));
      bouton.disabled = false;
    }
  };

  window.chargerPhotos = async function () {
    const zone = document.getElementById("photos");
    zone.innerHTML = "<p>Chargement des photos...</p>";

    try {
      const resultat = await delai(
        window.serviceKinClient
          .from("realisations")
          .select("id, professionnel_id, photo_path, description, statut, created_at")
          .order("created_at", { ascending: false }),
        15000,
        "chargement des photos"
      );

      if (resultat.error) throw resultat.error;

      zone.innerHTML = "";

      if (!resultat.data || resultat.data.length === 0) {
        zone.innerHTML = "<p>Aucune photo pour le moment.</p>";
        return;
      }

      for (const photo of resultat.data) {
        const carte = document.createElement("div");
        carte.className = "photo box";

        const titre = document.createElement("h3");
        titre.textContent = "Professionnel n° " + photo.professionnel_id;

        const statut = document.createElement("p");
        statut.textContent = "Statut : " + photo.statut;

        const description = document.createElement("p");
        description.textContent = photo.description || "Sans description";

        carte.append(titre, statut, description);

        const urlResult = await window.serviceKinClient.storage
          .from("realisations")
          .createSignedUrl(photo.photo_path, 3600);

        if (urlResult.data && urlResult.data.signedUrl) {
          const img = document.createElement("img");
          img.src = urlResult.data.signedUrl;
          img.alt = "Réalisation professionnelle";
          carte.appendChild(img);
        } else {
          const erreurPhoto = document.createElement("p");
          erreurPhoto.textContent = "Image inaccessible : " +
            (urlResult.error?.message || "URL indisponible");
          carte.appendChild(erreurPhoto);
        }

        const approuver = document.createElement("button");
        approuver.textContent = "Approuver";
        approuver.onclick = () => window.changerStatut(photo.id, "approuvee");

        const refuser = document.createElement("button");
        refuser.textContent = "Refuser";
        refuser.className = "refuse";
        refuser.onclick = () => window.changerStatut(photo.id, "refusee");

        const supprimer = document.createElement("button");
        supprimer.textContent = "Supprimer";
        supprimer.className = "delete";
        supprimer.onclick = () => window.supprimerPhoto(photo.id, photo.photo_path);

        carte.append(approuver, refuser, supprimer);
        zone.appendChild(carte);
      }

    } catch (erreur) {
      zone.textContent = "ERREUR DE CHARGEMENT : " + erreur.message;
    }
  };

  window.changerStatut = async function (id, statut) {
    try {
      const resultat = await window.serviceKinClient
        .from("realisations")
        .update({ statut: statut })
        .eq("id", id);

      if (resultat.error) throw resultat.error;

      alert("Statut mis à jour.");
      window.chargerPhotos();
    } catch (erreur) {
      alert("Erreur : " + erreur.message);
    }
  };

  window.supprimerPhoto = async function (id, chemin) {
    if (!confirm("Veux-tu vraiment supprimer cette photo ?")) return;

    try {
      const stockage = await window.serviceKinClient.storage
        .from("realisations")
        .remove([chemin]);

      if (stockage.error) throw stockage.error;

      const resultat = await window.serviceKinClient
        .from("realisations")
        .delete()
        .eq("id", id);

      if (resultat.error) throw resultat.error;

      alert("Photo supprimée.");
      window.chargerPhotos();
    } catch (erreur) {
      alert("Erreur : " + erreur.message);
    }
  };

  message("Prêt. Tu peux te connecter.");
})();
</script>
</body>
</html>
